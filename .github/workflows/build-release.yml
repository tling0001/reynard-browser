name: Build Release

on:
  push:
    branches:
      - main
    paths:
      - 'browser/Configuration/Reynard.xcconfig'
      - '.github/workflows/build-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tag:
    name: Create version tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      target_sha: ${{ steps.version.outputs.target_sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read app version and create tag
        id: version
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const config = fs.readFileSync('browser/Configuration/Reynard.xcconfig', 'utf8');
            const match = config.match(/^CURRENT_VERSION\\s*=\\s*([^\\s#]+)\\s*$/m);
            if (!match) {
              core.setFailed('Could not find CURRENT_VERSION in browser/Configuration/Reynard.xcconfig.');
              return;
            }

            const version = match[1];
            if (!/^\\d+\\.\\d+\\.\\d+(?:[-+][0-9A-Za-z.-]+)?$/.test(version)) {
              core.setFailed(`Invalid app version "${version}". Expected a semantic version such as 0.22.1.`);
              return;
            }

            const tag = version;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            let targetSha = context.sha;

            try {
              const existing = await github.rest.git.getRef({
                owner, repo, ref: `tags/${tag}`
              });
              targetSha = existing.data.object.sha;
              if (targetSha !== context.sha) {
                core.setFailed(`Tag ${tag} already exists at ${targetSha}, not the current commit ${context.sha}. Update CURRENT_VERSION before creating another release.`);
                return;
              }
              core.info(`Tag ${tag} already exists at this commit; continuing with it.`);
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({
                owner, repo, ref: `refs/tags/${tag}`, sha: targetSha
              });
              core.info(`Created tag ${tag} at ${targetSha}.`);
            }

            core.setOutput('tag', tag);
            core.setOutput('target_sha', targetSha);

  build:
    name: Build versioned IPA
    needs: tag
    uses: ./.github/workflows/build.yml
    with:
      checkout_ref: ${{ needs.tag.outputs.target_sha }}
      build_normal_ipa: true

  release:
    name: Create GitHub release
    needs:
      - tag
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create or update draft release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.tag.outputs.tag }}
          name: Reynard ${{ needs.tag.outputs.tag }}
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
          draft: true
          fail_on_unmatched_files: true
          files: |
            dist/Reynard.ipa
